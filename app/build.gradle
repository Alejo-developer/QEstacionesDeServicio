plugins {
    id 'com.android.application'
}

// Credenciales SMTP leídas de local.properties (git-ignored) para no subirlas al repositorio
def propiedadesLocales = new Properties()
def archivoLocal = rootProject.file('local.properties')
if (archivoLocal.exists()) {
    archivoLocal.withInputStream { propiedadesLocales.load(it) }
}

android {
    namespace 'com.estaciones.qestaciones'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.estaciones.qestaciones"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "SMTP_CORREO", "\"${propiedadesLocales.getProperty('smtp.correo', '')}\""
        buildConfigField "String", "SMTP_CONTRASENA", "\"${propiedadesLocales.getProperty('smtp.contrasena', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Evitar conflictos de META-INF con JavaMail
    packagingOptions {
        exclude 'META-INF/NOTICE.md'
        exclude 'META-INF/LICENSE.md'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/LICENSE.txt'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // HU-02: JavaMail para envío SMTP real de códigos 2FA
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'

    // Lab Retrofit (HU-17): consumo de servicios REST hacia el servidor nacional
    // de boletines normativos. Retrofit + Gson para (de)serialización + OkHttp
    // logging para ver los requests/responses en Logcat durante pruebas.
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
}
